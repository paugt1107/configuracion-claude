name: radar-web
# Trabajador 1: cada 30 min recopila noticias, vídeos y posts de GTA VI (solo títulos y enlaces). Sin coste ni tokens.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["canal-youtube/fuentes/radar.yaml", "clipfactory/radar_web.py"]
permissions:
  contents: write
concurrency:
  group: radar-web
  cancel-in-progress: true
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - run: python3 -c "from clipfactory import radar_web; radar_web.run()"
      - name: Guardar
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add canal-youtube/data/radar canal-youtube/fuentes/radar.yaml
          git diff --cached --quiet && exit 0
          git commit -q -m "Radar web $(date -u +%H:%M) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
