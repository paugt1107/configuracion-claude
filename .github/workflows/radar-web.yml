name: Valentín · Radar GTA (cada 30 min, todos los idiomas)
# Trabajador 1: cada 30 min recopila noticias, vídeos y posts de GTA VI (solo títulos y enlaces). Sin coste ni tokens.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["canal-youtube/fuentes/radar.yaml", "clipfactory/radar_web.py"]
permissions:
  contents: write
concurrency:
  group: radar-web
  cancel-in-progress: true
jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e ".[demanda]"
      - name: Recoger
        run: python3 -c "from clipfactory import radar_web; radar_web.run()" 2>&1 | tee canal-youtube/datos/radar/log.txt
      - name: Qué busca la gente (autocompletado de Google y YouTube, cada hora)
        run: |
          # en las pasadas automáticas solo una vez por hora (minuto 0-14); a mano, siempre
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%M)" -lt 30 ]; then python3 -m clipfactory.demanda || true; fi
      - name: Vídeos que superan 10x su canal (solo con YOUTUBE_API_KEY)
        if: env.YOUTUBE_API_KEY != ''
        run: python3 -m clipfactory radar "GTA 6" --dias 2 --region ES || true
      - name: Guardar
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add canal-youtube/datos canal-youtube/fuentes/radar.yaml
          git diff --cached --quiet && exit 0
          git commit -q -m "Radar web $(date -u +%H:%M) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
