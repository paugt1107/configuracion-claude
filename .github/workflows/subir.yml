name: Studio · Subir y programar en YouTube
# Sube a YouTube cada vídeo APTO del calendario PROGRAMADO para su fecha (queda privado hasta esa hora y se publica solo).
# Necesita (Settings → Secrets → Actions): YT_CLIENT_ID, YT_CLIENT_SECRET_VALUE, YT_REFRESH_TOKEN. Pasos: docs/configuracion.md
# Solo se lanza A MANO (publicar es decisión del dueño). "prueba" = solo dice qué subiría.
on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "true = no sube nada, solo lista lo que subiría"
        default: "true"
permissions:
  contents: write
jobs:
  subir:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET_VALUE: ${{ secrets.YT_CLIENT_SECRET_VALUE }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e ".[youtube]"
      - name: Subir y programar
        run: |
          python3 -c "
          from clipfactory import upload_youtube as u
          for i, c in u.programar_calendario(dry_run='${{ github.event.inputs.prueba }}' == 'true'): print(i, '→', c)"
      - name: Guardar marcas de subida
        if: github.event.inputs.prueba != 'true'
        run: |
          git config user.name "studio-bot"; git config user.email "studio-bot@users.noreply.github.com"
          git add entregas canal-youtube/datos
          git diff --cached --quiet || git commit -q -m "Subidas programadas a YouTube [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
