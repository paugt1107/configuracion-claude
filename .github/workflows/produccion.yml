name: Fernanda · Producción de vídeos
# Producción automática con voz IA (la sesión de Claude no tiene acceso a servicios de voz; GitHub sí).
# Se lanza al cambiar un guion (canal-youtube/audio/SXXX-narracion.txt) o un job, o a mano (Actions → produccion → Run).
# Voz: auto = ElevenLabs si hay secreto ELEVENLABS_API_KEY, si no OpenAI (OPENAI_API_KEY), si no voces gratuitas (edge-tts).
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Guion (p. ej. S001) — vacío = según cambios"
        default: "S001"
      proveedor:
        description: "auto | edge | openai | elevenlabs"
        default: "auto"
  push:
    branches: [main]
    paths:
      - "canal-youtube/guiones/S*.yaml"
permissions:
  contents: write
concurrency:
  group: produccion
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_multilingual_v2' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'es-ES-AlvaroNeural' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          sudo apt-get install -y -qq fonts-inter || true
          pip install -q -e ".[voz]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Motor 3D (three.js + Chromium)
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: Caché de música (Kevin MacLeod, CC BY)
        uses: actions/cache@v4
        with:
          path: media/musica
          key: musica-${{ hashFiles('clipfactory/musica.py') }}
      - name: Producir
        run: |
          mkdir -p /tmp/logs
          set -o pipefail
          {
            JOBS=""
            if [ -n "${{ github.event.inputs.job }}" ]; then
              JOBS="canal-youtube/guiones/${{ github.event.inputs.job }}.yaml"
            else
              for f in $(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null); do
                case "$f" in
                  canal-youtube/guiones/S*.yaml) JOBS="$JOBS $f" ;;
                esac
              done
            fi
            for j in $(echo $JOBS | tr ' ' '\n' | sort -u); do
              if [ -f "$j" ]; then python3 -m clipfactory producir "$j" --proveedor "${{ github.event.inputs.proveedor || 'auto' }}" || echo "FALLO en $j (sigo con el resto)"; fi
            done
          } 2>&1 | tee /tmp/logs/produccion.log
      - name: Calendario de publicación (reparte los vídeos APTO desde el próximo jueves)
        if: always()
        run: python3 -m clipfactory.calendario || true
      - name: Guardar entregas
        if: always()
        run: |
          git config user.name "produccion-bot"
          git config user.email "produccion-bot@users.noreply.github.com"
          git add entregas canal-youtube/datos/calendario.md canal-youtube/datos/calendario.ics
          [ -d media/libres ] && git add media/libres
          git diff --cached --quiet && exit 0
          git commit -m "Producción automática (${{ github.run_id }}) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
