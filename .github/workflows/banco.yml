name: Tommy · Banco de imágenes (oficiales + tráileres + libres, animadas en 3D)
# 1) recoger: capturas/artes OFICIALES de GTA VI, fotogramas de los TRÁILERES oficiales, fotos LIBRES (Openverse + Commons),
#    etiquetas con CLIP, Lucía/Jason a media/oficial y recortes.  2) animar: 6 máquinas EN PARALELO hacen los clips 3D.
# 3) final: galería media/banco/GALERIA.md y rehace los vídeos que usan fotos de personajes.
on:
  workflow_dispatch:
    inputs:
      maximo:
        description: "Máximo de imágenes nuevas por fuente"
        default: "1000"
  # EN PAUSA (standby por decisión del dueño): para reactivar, quita el # de las dos líneas siguientes
  # schedule:
  #   - cron: "17 4 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: banco
  cancel-in-progress: false
env:
  MAXIMO: ${{ github.event.inputs.maximo || '1000' }}
jobs:
  # 1) tres recolectores A LA VEZ (cada uno escribe su propio índice)
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    # con el repo PRIVADO no arranca (14 máquinas gastarían el cupo de minutos del mes); con el repo PÚBLICO es gratis
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        # una máquina por fuente y 12 para las fotos libres (se reparten las categorías; cada una con su IP)
        fuente: [oficial, trailers]
        include:
          - { fuente: libres, parte: 0 }
          - { fuente: libres, parte: 1 }
          - { fuente: libres, parte: 2 }
          - { fuente: libres, parte: 3 }
          - { fuente: libres, parte: 4 }
          - { fuente: libres, parte: 5 }
          - { fuente: libres, parte: 6 }
          - { fuente: libres, parte: 7 }
          - { fuente: libres, parte: 8 }
          - { fuente: libres, parte: 9 }
          - { fuente: libres, parte: 10 }
          - { fuente: libres, parte: 11 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -e ".[descargas]"
          if [ "${{ matrix.fuente }}" != libres ]; then npm install -g playwright@1.63.0 && npx -y playwright@1.63.0 install --with-deps chromium; fi
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          cat > /tmp/guardar.sh <<'EOF'
          git config user.name "banco-bot"
          git config user.email "banco-bot@users.noreply.github.com"
          for d in media/banco media/oficial media/recortes; do [ -e "$d" ] && git add "$d"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "Banco de imágenes: $1 [skip ci]"
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((i * 6)); done
          EOF
          chmod +x /tmp/guardar.sh
      - name: Recoger ${{ matrix.fuente }} ${{ matrix.parte }} (guarda en git cada 6 min)
        timeout-minutes: 160
        continue-on-error: true
        run: |
          EXTRA=""; [ -n "${{ matrix.parte }}" ] && EXTRA="--parte ${{ matrix.parte }} --partes 12"
          python3 -m clipfactory.banco ${{ matrix.fuente }} --max "$MAXIMO" $EXTRA &
          PID=$!
          while kill -0 $PID 2>/dev/null; do sleep 360; /tmp/guardar.sh "${{ matrix.fuente }} ${{ matrix.parte }} (parcial)" || true; done
          wait $PID
      - run: /tmp/guardar.sh "${{ matrix.fuente }} ${{ matrix.parte }}"
        if: always()

  # 2) etiquetar con CLIP, sacar Lucía/Jason y recortes
  etiquetar:
    needs: recoger
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e ".[banco,recortes]"
          cat > /tmp/guardar.sh <<'EOF'
          git config user.name "banco-bot"
          git config user.email "banco-bot@users.noreply.github.com"
          for d in media/banco media/oficial media/recortes; do [ -e "$d" ] && git add "$d"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "Banco de imágenes: $1 [skip ci]"
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((i * 6)); done
          EOF
          chmod +x /tmp/guardar.sh
      - name: Etiquetar (CLIP) y sacar Lucía/Jason
        run: python3 -m clipfactory.banco etiquetar
        continue-on-error: true
      - name: Pasar todo a DIBUJO (estilo GTA)
        run: python3 -m clipfactory.banco dibujar
        continue-on-error: true
      - name: Recortes de personajes
        run: python3 -c "from clipfactory import recorte; print(recorte.process_all())"
        continue-on-error: true
        timeout-minutes: 15
      - run: /tmp/guardar.sh "etiquetas, personajes y recortes"
        if: always()

  animar:
    needs: etiquetar
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -e .
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Animar en 3D (parte ${{ matrix.parte }} de 6, guardando cada 15)
        run: |
          git config user.name "banco-bot"
          git config user.email "banco-bot@users.noreply.github.com"
          for tanda in $(seq 1 40); do
            python3 -m clipfactory.banco animar --max 15 --parte ${{ matrix.parte }} --partes 6 | tee /tmp/anim.txt
            git add media/banco/animadas 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "Banco: clips 3D parte ${{ matrix.parte }} tanda $tanda [skip ci]"
              for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((i * 4 + ${{ matrix.parte }})); done
            fi
            grep -q "animadas: 0" /tmp/anim.txt && break
          done

  final:
    needs: animar
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - name: Galería e índice
        run: |
          python3 -m clipfactory.banco galeria
          git config user.name "banco-bot"
          git config user.email "banco-bot@users.noreply.github.com"
          git add media/banco
          git diff --cached --quiet || git commit -q -m "Banco: galería [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
