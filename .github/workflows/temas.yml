name: Tommy · Galería por temas (fotos libres → dibujos animados)
# Baja fotos LIBRES (Openverse + Wikimedia Commons: CC0, dominio público, CC BY, CC BY-SA, con crédito automático) de las
# categorías pedidas, las pasa a DIBUJO ANIMADO (estilo cartoon) y rehace la galería: media/banco/GALERIA.md y
# media/banco/temas/<tema>/GALERIA.md. Sin clips 3D (pesan mucho en git): el mundo 3D usa las imágenes directamente.
on:
  workflow_dispatch:
    inputs:
      temas:
        description: "Categorías principales (de canal-youtube/fuentes/banco.yaml), separadas por comas"
        default: "huevos,gallinas,gallos,pollitos,dinosaurios,fosiles,prehistoria,selva,granja,laboratorio"
      n:
        description: "Fotos por consulta y buscador (temas principales)"
        default: "4"
      extra:
        description: "Categorías generales para el futuro (menos fotos por consulta)"
        default: "aves,reptiles,mamiferos,insectos,plantas,naturaleza,espacio,oceano,historia,ciencia,comida,ciudades"
      n_extra:
        description: "Fotos por consulta y buscador (generales)"
        default: "2"
      estilo:
        description: "cartoon | comic | gta | neon | boceto"
        default: "cartoon"
permissions:
  contents: write
concurrency:
  group: banco
  cancel-in-progress: false
jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          pip install -q -e .
          cat > /tmp/guardar.sh <<'EOF'
          git config user.name "banco-bot"
          git config user.email "banco-bot@users.noreply.github.com"
          git add media/banco
          git diff --cached --quiet && exit 0
          git commit -q -m "Galería por temas: $1 [skip ci]"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q -X theirs && git push -q && break; sleep $((i * 7)); done
          EOF
          chmod +x /tmp/guardar.sh
      - name: Bajar fotos libres (parte ${{ matrix.parte }} de 8)
        timeout-minutes: 130
        continue-on-error: true
        run: |
          python3 -m clipfactory.banco libres --cat "${{ github.event.inputs.temas }}" --n "${{ github.event.inputs.n }}" \
            --lado 1280 --parte ${{ matrix.parte }} --partes 8 --max 400
          /tmp/guardar.sh "temas ${{ matrix.parte }}" || true
          [ -n "${{ github.event.inputs.extra }}" ] && python3 -m clipfactory.banco libres --cat "${{ github.event.inputs.extra }}" \
            --n "${{ github.event.inputs.n_extra }}" --lado 1280 --parte ${{ matrix.parte }} --partes 8 --max 300 || true
      - run: /tmp/guardar.sh "libres ${{ matrix.parte }}"
        if: always()

  dibujar:
    needs: recoger
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - name: Pasar a dibujo animado y rehacer la galería
        run: |
          CATS="${{ github.event.inputs.temas }},${{ github.event.inputs.extra }}"
          python3 -m clipfactory.banco dibujar --estilo "${{ github.event.inputs.estilo }}" --cat "${CATS%,}"
      - name: Guardar
        if: always()
        run: |
          git config user.name "banco-bot"
          git config user.email "banco-bot@users.noreply.github.com"
          git add media/banco
          git diff --cached --quiet && exit 0
          git commit -q -m "Galería por temas: dibujos animados y galería [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i * 5)); done
