const PLANTILLA = [

const POR_ID = Object.fromEntries(PLANTILLA.map(p => [p.id, p]));

/* =====================================================================================================
   MUNDO ISOMÉTRICO (pixel-art dibujado por código). Rejilla de 22×16 baldosas; cada departamento tiene su
   zona con alfombra, mesas y monitores. Se dibuja en un lienzo pequeño y se escala sin suavizado.
   ===================================================================================================== */
const TW = 24, TH = 12;           // baldosa isométrica 2:1
const GW = 22, GH = 16;           // tamaño de la planta en baldosas
const MURO = 74;                  // altura de las paredes en píxeles
const LW = (GW + GH) * TW / 2 + 40, LH = (GW + GH) * TH / 2 + MURO + 50;
const OX = GH * TW / 2 + 20, OY = MURO + 24;
const iso = (x, y, z = 0) => [Math.round(OX + (x - y) * TW / 2), Math.round(OY + (x + y) * TH / 2 - z)];

// zonas de departamento: [x0, y0, x1, y1] en baldosas
const ZONAS = {
  radar:      [1, 1, 6, 6],
  guion:      [8, 1, 14, 6],
  produccion: [15, 1, 21, 7],
  imagen:     [1, 9, 7, 14],
  calidad:    [9, 9, 15, 14],
};
// mesa de cada persona: baldosa de la mesa (la silla queda en y+1) — orden = PLANTILLA
const MESAS = {
  valentin: [3, 2], tendencias: [1.6, 4.2], documentalista: [4.4, 4.2],
  pedro: [11, 2], guionista: [9, 4.2], estratega: [11.2, 4.2], packaging: [13.2, 4.2],
  fernanda: [18, 2], "voz-audio": [15.6, 4.4], sonido: [17.6, 4.4], animacion: [19.6, 4.4], editor: [17.6, 6.2],
  tommy: [4, 10], "director-arte": [2, 12.2],
  irene: [12, 10], retencion: [9.8, 12.2], studio: [12, 12.2], comunidad: [14.2, 12.2],
};
// puntos a los que se acercan cuando descansan
const DESCANSO = { cafe: [18.5, 10.5], sofa: [19.5, 13.2], pizarra: [8.6, 1.4], ventana: [6.6, 7.6], servidor: [16.6, 9.2], fuente: [20.2, 9.8] };

const lienzo = document.getElementById("mundo");
const vista = lienzo.getContext("2d");
const capa = document.createElement("canvas"); capa.width = LW; capa.height = LH;
const g = capa.getContext("2d");
let mostrarNombres = true, atardecer = true, seleccionado = "valentin", t0 = performance.now();
const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- primitivas ----------
function baldosa(x, y, color, borde) {
  const [a, b] = iso(x, y), [c, d] = iso(x + 1, y), [e, f] = iso(x + 1, y + 1), [h, i] = iso(x, y + 1);
  g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.lineTo(e, f); g.lineTo(h, i); g.closePath();
  g.fillStyle = color; g.fill();
  if (borde) { g.strokeStyle = borde; g.lineWidth = 1; g.stroke(); }
}
function caja(x, y, w, d, alto, cTop, cIzq, cDer, z = 0) {
  // prisma isométrico con base en (x,y), ancho w (eje x), fondo d (eje y)
  const p = (px, py, pz) => iso(px, py, pz);
  const A = p(x, y + d, z), B = p(x + w, y + d, z), C = p(x + w, y, z);
  const At = p(x, y + d, z + alto), Bt = p(x + w, y + d, z + alto), Ct = p(x + w, y, z + alto), Dt = p(x, y, z + alto);
  g.fillStyle = cIzq; g.beginPath(); g.moveTo(...A); g.lineTo(...B); g.lineTo(...Bt); g.lineTo(...At); g.fill();
  g.fillStyle = cDer; g.beginPath(); g.moveTo(...B); g.lineTo(...C); g.lineTo(...Ct); g.lineTo(...Bt); g.fill();
  g.fillStyle = cTop; g.beginPath(); g.moveTo(...At); g.lineTo(...Bt); g.lineTo(...Ct); g.lineTo(...Dt); g.fill();
}
function sombra(x, y, r = 7) { const [sx, sy] = iso(x, y); g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.ellipse(sx, sy, r, r / 2, 0, 0, 7); g.fill(); }

// pared: transforma coordenadas locales (u = baldosas a lo largo, v = píxeles hacia arriba) a pantalla
function enPared(lado, fn) {
  g.save();
  if (lado === "fondo") { const [x0, y0] = iso(0, 0); g.setTransform(TW / 2, TH / 2, 0, -1, x0, y0); }  // a lo largo de x

// ---------- vista por las ventanas: atardecer de Vice City (se dibuja en coordenadas de pared) ----------
const EDIFICIOS = Array.from({ length: 70 }, (_, i) => ({ u: i * 0.62 + (i * 7 % 5) * 0.08, w: 0.35 + (i * 13 % 7) * 0.07, h: 18 + (i * 37 % 29) + (i % 9 === 0 ? 18 : 0), luz: i * 17 % 11 }));
const PALMERAS = [1.2, 4.7, 9.4, 13.1, 17.8, 20.6];
function ventanal(u0, u1, v0, v1, t, idx) {
  const cielo = g.createLinearGradient(0, v1, 0, v0);
  if (atardecer) { cielo.addColorStop(0, "#2a1650"); cielo.addColorStop(0.45, "#c63d7d"); cielo.addColorStop(0.75, "#ff8a4c"); cielo.addColorStop(1, "#ffd27a"); }
  else { cielo.addColorStop(0, "#05040c"); cielo.addColorStop(0.6, "#120d2a"); cielo.addColorStop(1, "#2a1a48"); }
  g.fillStyle = cielo; g.fillRect(u0, v0, u1 - u0, v1 - v0);
  // sol
  if (atardecer) { g.fillStyle = "rgba(255,226,140,.9)"; g.beginPath(); g.ellipse((u0 + u1) / 2 + idx * 0.4, v0 + 14, 0.6, 7, 0, 0, 7); g.fill(); }
  // edificios
  for (const e of EDIFICIOS) {
    if (e.u + e.w < u0 || e.u > u1) continue;
    const a = Math.max(e.u, u0), b = Math.min(e.u + e.w, u1);
    g.fillStyle = atardecer ? "#24163f" : "#0d0a1d"; g.fillRect(a, v0, b - a, Math.min(e.h, v1 - v0 - 4));
    // ventanitas encendidas (parpadean muy lento)
    g.fillStyle = "rgba(255,214,120,.75)";
    for (let k = 4; k < e.h - 3; k += 5) if (((k + e.luz + Math.floor(t / 4)) % 7) < 2) g.fillRect(a + 0.08, v0 + k, 0.08, 1.2);
  }
  // palmeras en primer plano
  g.fillStyle = atardecer ? "#160c26" : "#07060f";
  for (const pu of PALMERAS) {
    if (pu < u0 || pu > u1) continue;
    g.fillRect(pu, v0, 0.07, 28);                                  // tronco
    const viento = reducir ? 0 : Math.sin(t * 0.8 + pu) * 0.04;
    for (let k = -3; k <= 3; k++) g.fillRect(pu + k * 0.16 - 0.1 + viento, v0 + 28 - Math.abs(k) * 1.6, 0.3, 2);   // copa
    g.fillRect(pu - 0.12, v0 + 28, 0.3, 2.5);
  }
}

function paredes(t) {
  // pared del fondo (a lo largo de x) y pared izquierda (a lo largo de y)
  enPared("fondo", () => {
    g.fillStyle = "#1b1630"; g.fillRect(0, 0, GW, MURO);
    g.fillStyle = "#231d3d"; g.fillRect(0, MURO - 6, GW, 6);
    for (let i = 0; i < 5; i++) ventanal(1 + i * 4.2, 4.6 + i * 4.2, 10, MURO - 12, t, i);
    g.fillStyle = "#2d2650"; for (let i = 0; i <= 5; i++) g.fillRect(0.6 + i * 4.2, 8, 0.25, MURO - 18);
    g.fillStyle = "#120f22"; g.fillRect(0, 0, GW, 4);

    g.fillStyle = "#17132a"; g.fillRect(0, 0, GH, MURO);
    g.fillStyle = "#1f1a36"; g.fillRect(0, MURO - 6, GH, 6);

function suelo() {
  for (let x = 0; x < GW; x++) for (let y = 0; y < GH; y++) baldosa(x, y, (x + y) % 2 ? "#1c1830" : "#201b37");
  for (const [dep, [x0, y0, x1, y1]] of Object.entries(ZONAS)) {

/* ---------- objetos con profundidad: cada uno sabe su (x+y) para ordenarse con las personas ---------- */
const OBJETOS = [];
function objeto(x, y, dibujar) { OBJETOS.push({ x, y, prof: x + y, dibujar }); }

function mesa(x, y, color, persona) {

    caja(x, y, 1.6, 0.8, 14, "#3a3157", "#2a2342", "#231d38");
    caja(x + 0.05, y + 0.05, 1.5, 0.7, 1, color + "66", color + "44", color + "33", 14);
    // monitor: brilla y "teclea" si el departamento trabaja
    const est = estadoDe(persona), activo = est === "trabajando";
    const [mx, my] = iso(x + 0.8, y + 0.15, 16);
    g.fillStyle = "#0c0a16"; g.fillRect(mx - 9, my - 13, 18, 12);
    const pant = activo ? (reducir ? "#4fe3c9" : `hsl(${170 + 20 * Math.sin(t * 2 + x)},70%,${48 + 8 * Math.sin(t * 9 + y)}%)`) : est === "fallo" ? "#8a2b3a" : "#2c3a5a";
    g.fillStyle = pant; g.fillRect(mx - 8, my - 12, 16, 10);
    if (activo) { g.fillStyle = "rgba(255,255,255,.55)"; for (let k = 0; k < 3; k++) g.fillRect(mx - 6, my - 10 + k * 3, 4 + ((Math.floor(t * 6) + k * 3 + x) % 9), 1); }
    g.fillStyle = "#0c0a16"; g.fillRect(mx - 1, my - 1, 2, 3);

}
function planta(x, y) { objeto(x, y, () => { caja(x - 0.2, y - 0.2, 0.4, 0.4, 7, "#6b4a2f", "#4e3521", "#3f2a1a"); const [sx, sy] = iso(x, y, 10); g.fillStyle = "#2f8f55"; for (let i = 0; i < 5; i++) { g.beginPath(); g.ellipse(sx + (i - 2) * 2.5, sy - 4 - (i % 2) * 3, 3, 6, (i - 2) * 0.4, 0, 7); g.fill(); } }); }
function estanteria(x, y) { objeto(x, y, () => { caja(x, y, 1.2, 0.4, 34, "#3b2c22", "#2c2019", "#241a14"); for (let k = 0; k < 4; k++) { const [sx, sy] = iso(x + 0.1, y + 0.4, 6 + k * 8); for (let b = 0; b < 6; b++) { g.fillStyle = ["#c2185b", "#3fe0d0", "#ffc24b", "#a07bff", "#57d68d", "#e0662d"][(b + k) % 6]; g.fillRect(sx + b * 2.4, sy - 6, 2, 6); } } }); }
function servidor(x, y) {

}
function cafetera(x, y) { objeto(x, y, (t) => { caja(x, y, 1, 0.6, 16, "#4a3f66", "#352d4d", "#2c2541"); caja(x + 0.3, y + 0.15, 0.4, 0.3, 10, "#20202a", "#18181f", "#121217", 16); const [sx, sy] = iso(x + 0.5, y + 0.3, 28); if (!reducir) { g.fillStyle = "rgba(255,255,255,.25)"; for (let k = 0; k < 3; k++) g.fillRect(sx + Math.sin(t * 2 + k) * 2, sy - k * 4 - ((t * 8) % 4), 1, 2); } }); }
function sofa(x, y) { objeto(x, y, () => { caja(x, y, 2.2, 0.9, 6, "#5b3fa0", "#452f7c", "#3a2768"); caja(x, y, 2.2, 0.25, 14, "#6a4bb5", "#4e3690", "#41307a"); }); }

function montarObjetos() {
  OBJETOS.length = 0;
  for (const p of PLANTILLA) { const [x, y] = MESAS[p.id]; mesa(x, y, DEPARTAMENTOS[p.dep].color, p.id); }

/* ---------- personas: sprite procedural de 12×20, con caminar, teclear y respirar ---------- */
function sprite(ctx, look, x, y, escala, pose, fase) {
  const px = (cx, cy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x + cx * escala, y + cy * escala, w * escala, h * escala); };
  const paso = pose === "andar" ? Math.round(Math.sin(fase) * 1.5) : 0;
  const resp = pose === "quieto" ? (Math.sin(fase) > 0.6 ? 1 : 0) : 0;
  const tecla = pose === "teclear" ? (Math.sin(fase * 3) > 0 ? 1 : 0) : 0;
  // piernas
  px(3, 15, 2, 5 - Math.max(0, paso), look.pant); px(7, 15, 2, 5 - Math.max(0, -paso), look.pant);
  px(3, 19 - Math.max(0, paso), 2, 1, "#111"); px(7, 19 - Math.max(0, -paso), 2, 1, "#111");
  // cuerpo
  px(2, 8 + resp, 8, 8 - resp, look.ropa); px(2, 8 + resp, 8, 1, "rgba(255,255,255,.18)");
  // brazos
  px(0, 9 + resp, 2, 5 - tecla, look.ropa); px(10, 9 + resp, 2, 5 - (1 - tecla), look.ropa);
  px(0, 14 - tecla + resp, 2, 1, look.piel); px(10, 13 + tecla + resp, 2, 1, look.piel);
  // cabeza
  px(3, 2 + resp, 6, 6, look.piel);
  px(3, 1 + resp, 6, 2, look.pelo); px(2, 2 + resp, 1, look.larga ? 8 : 3, look.pelo); px(9, 2 + resp, 1, look.larga ? 8 : 3, look.pelo);
  if (look.barba) px(3, 6 + resp, 6, 2, look.pelo);
  px(4, 4 + resp, 1, 1, "#16121f"); px(7, 4 + resp, 1, 1, "#16121f");
  if (look.gafas) { px(3, 4 + resp, 3, 1, "rgba(20,20,30,.7)"); px(6, 4 + resp, 3, 1, "rgba(20,20,30,.7)"); }
}
function retrato(canvas, look) {
  const c = canvas.getContext("2d"); canvas.width = 16; canvas.height = 16; c.imageSmoothingEnabled = false;
  c.fillStyle = "#241f3b"; c.fillRect(0, 0, 16, 16);
  const tmp = document.createElement("canvas"); tmp.width = 12; tmp.height = 20; sprite(tmp.getContext("2d"), look, 0, 0, 1, "quieto", 0);
  c.drawImage(tmp, 0, 0, 12, 12, 2, 2, 12, 12);
}

const GENTE = PLANTILLA.map((p, i) => {
  const [mx, my] = MESAS[p.id];
  const silla = [mx + 0.8, my + 1.05];
  return { ...p, x: silla[0], y: silla[1], silla, destino: null, espera: 2 + (i * 1.3) % 6, fase: i };
});

function estadoDe(id) {
  const p = POR_ID[id]; if (!p) return "esperando";
  const jefe = DEPARTAMENTOS[p.dep].jefe;
  return estado?.trabajadores?.[jefe]?.estado || "esperando";
}

function moverGente(dt) {
  for (const p of GENTE) {
    const est = estadoDe(p.id);
    if (est === "trabajando") {                     // a su mesa y a teclear
      p.destino = p.silla;
    } else if (!p.destino || (p.destino === p.silla && dist(p, p.silla) < 0.05)) {
      p.espera -= dt;
      if (p.espera <= 0) {
        const opciones = Object.values(DESCANSO);
        p.destino = Math.random() < 0.55 ? p.silla : opciones[Math.floor(Math.random() * opciones.length)];
        p.espera = 4 + Math.random() * 8;
      }
    }
    if (p.destino) {
      const dx = p.destino[0] - p.x, dy = p.destino[1] - p.y, d = Math.hypot(dx, dy);
      const v = 1.6 * dt;
      if (d > 0.05) { p.x += dx / d * Math.min(v, d); p.y += dy / d * Math.min(v, d); p.andando = true; }
      else { p.andando = false; if (p.destino !== p.silla) { p.espera -= dt; if (p.espera <= 0) { p.destino = p.silla; p.espera = 5 + Math.random() * 6; } } }
    }
    p.fase += dt * (p.andando ? 9 : 2);
  }
}
const dist = (p, q) => Math.hypot(p.x - q[0], p.y - q[1]);

function etiqueta(x, y, z, texto, color = "#ece8f7", fondo = "rgba(13,11,23,.85)") {
  const [sx, sy] = iso(x, y, z);
  g.font = "6px Silkscreen, monospace"; const w = Math.ceil(g.measureText(texto).width) + 6;
  g.fillStyle = fondo; g.fillRect(sx - w / 2, sy - 8, w, 9);
  g.fillStyle = color; g.textAlign = "center"; g.fillText(texto, sx, sy - 1.5); g.textAlign = "start";
}
function dibujarPersona(p, t) {
  const est = estadoDe(p.id), enMesa = dist(p, p.silla) < 0.06;
  const pose = p.andando ? "andar" : (est === "trabajando" && enMesa) ? "teclear" : "quieto";
  sombra(p.x, p.y, 5);
  const [sx, sy] = iso(p.x, p.y);
  sprite(g, p.look, sx - 6, sy - 20, 1, pose, p.fase);
  if (p.id === seleccionado) { g.strokeStyle = "#3fe0d0"; g.lineWidth = 1; g.beginPath(); g.ellipse(sx, sy, 8, 4, 0, 0, 7); g.stroke(); }
  if (mostrarNombres || p.id === seleccionado) {
    const col = { trabajando: "#ffc24b", ok: "#57d68d", fallo: "#ff5d5d" }[est] || "#c9c3e0";
    etiqueta(p.x, p.y, 24 + (p.jefe ? 2 : 0), (p.jefe ? "★ " : "") + p.nombre, col);
  }
  // bocadillo: tecleando / hecho / fallo
  if (p.jefe && est === "trabajando" && !reducir) { const [bx, by] = iso(p.x, p.y, 36); g.fillStyle = "#ece8f7"; for (let k = 0; k < 3; k++) if (Math.floor(t * 3) % 4 > k) g.fillRect(bx - 4 + k * 3, by, 2, 2); }
  if (p.jefe && est === "fallo") etiqueta(p.x, p.y, 36, "!", "#ff5d5d");
}

/* ---------- Michi, el gato ---------- */
const MICHI = { x: 19, y: 12.5, destino: [19, 12.5], espera: 3, fase: 0 };
function moverGato(dt) {
  const d = Math.hypot(MICHI.destino[0] - MICHI.x, MICHI.destino[1] - MICHI.y);
  if (d < 0.05) { MICHI.espera -= dt; if (MICHI.espera < 0) { const m = GENTE[Math.floor(Math.random() * GENTE.length)]; MICHI.destino = Math.random() < 0.5 ? [19, 12.6] : [m.silla[0] + 0.6, m.silla[1] + 0.3]; MICHI.espera = 4 + Math.random() * 6; } }
  else { MICHI.x += (MICHI.destino[0] - MICHI.x) / d * Math.min(d, 1.1 * dt); MICHI.y += (MICHI.destino[1] - MICHI.y) / d * Math.min(d, 1.1 * dt); MICHI.fase += dt * 10; }
}
function dibujarGato() {
  sombra(MICHI.x, MICHI.y, 3); const [sx, sy] = iso(MICHI.x, MICHI.y);
  g.fillStyle = "#f0a347"; g.fillRect(sx - 4, sy - 5, 7, 3); g.fillRect(sx + 2, sy - 7, 3, 3); g.fillRect(sx + 2, sy - 8, 1, 1); g.fillRect(sx + 4, sy - 8, 1, 1);
  g.fillRect(sx - 5, sy - 7 + Math.round(Math.sin(MICHI.fase) * 0.6), 1, 3);
  g.fillStyle = "#1a1220"; g.fillRect(sx + 3, sy - 6, 1, 1);
  g.fillStyle = "#c97f2e"; g.fillRect(sx - 3, sy - 2, 1, 2); g.fillRect(sx + 1, sy - 2, 1, 2);
  if (mostrarNombres) etiqueta(MICHI.x, MICHI.y, 12, "Michi", "#f0a347");
}

/* ---------- bucle ---------- */
let ultimo = performance.now();
function frame(ahora) {
  const t = (ahora - t0) / 1000, dt = Math.min(0.1, (ahora - ultimo) / 1000); ultimo = ahora;
  if (!reducir) { moverGente(dt); moverGato(dt); }
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, LW, LH);
  g.fillStyle = "#0a0814"; g.fillRect(0, 0, LW, LH);
  paredes(t); suelo();
  const cosas = [...OBJETOS.map(o => ({ prof: o.prof + 0.5, f: () => o.dibujar(t) })),
    ...GENTE.map(p => ({ prof: p.x + p.y, f: () => dibujarPersona(p, t) })), { prof: MICHI.x + MICHI.y, f: dibujarGato }];
  cosas.sort((a, b) => a.prof - b.prof).forEach(c => c.f());
  // a pantalla, sin suavizado y centrado
  const r = lienzo.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  if (lienzo.width !== Math.round(r.width * dpr) || lienzo.height !== Math.round(r.height * dpr)) { lienzo.width = Math.round(r.width * dpr); lienzo.height = Math.round(r.height * dpr); }
  const esc = Math.min(lienzo.width / LW, lienzo.height / LH);
  escalaVista = esc; despX = (lienzo.width - LW * esc) / 2; despY = (lienzo.height - LH * esc) / 2;
  vista.imageSmoothingEnabled = false; vista.fillStyle = "#0a0814"; vista.fillRect(0, 0, lienzo.width, lienzo.height);
  vista.drawImage(capa, despX, despY, LW * esc, LH * esc);
  if (!reducir || !frame.pintado) { frame.pintado = true; requestAnimationFrame(frame); }
}
let escalaVista = 1, despX = 0, despY = 0;

lienzo.addEventListener("click", (e) => {
  const r = lienzo.getBoundingClientRect(), dpr = lienzo.width / r.width;
  const lx = ((e.clientX - r.left) * dpr - despX) / escalaVista, ly = ((e.clientY - r.top) * dpr - despY) / escalaVista;
  let mejor = null, md = 14;
  for (const p of GENTE) { const [sx, sy] = iso(p.x, p.y); const d = Math.hypot(lx - sx, ly - (sy - 10)); if (d < md) { md = d; mejor = p; } }
  if (mejor) elegir(mejor.id);
});
document.getElementById("btn-nombres").addEventListener("click", (e) => { mostrarNombres = !mostrarNombres; e.currentTarget.setAttribute("aria-pressed", mostrarNombres); if (reducir) requestAnimationFrame(frame); });
document.getElementById("btn-noche").addEventListener("click", (e) => { atardecer = !atardecer; e.currentTarget.textContent = atardecer ? "Atardecer" : "Noche"; e.currentTarget.setAttribute("aria-pressed", atardecer); if (reducir) requestAnimationFrame(frame); });

let estado = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hace = (iso) => {

  return m < 1 ? "ahora" : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`;
};
const ESTADO_TXT = { trabajando: "Trabajando", ok: "Terminado", fallo: "Con un fallo", esperando: "Esperando" };

function pintarEquipo() {
  const cont = $("equipo"); cont.innerHTML = "";
  for (const [dep, d] of Object.entries(DEPARTAMENTOS)) {
    const sec = document.createElement("div"); sec.className = "dep";
    sec.innerHTML = `<h3 style="color:${d.color}">${esc(d.nombre)}</h3>`;
    for (const p of PLANTILLA.filter(q => q.dep === dep)) {
      const est = estadoDe(p.id);
      const row = document.createElement("div");
      row.className = "persona" + (p.jefe ? " jefe" : ""); row.tabIndex = 0; row.setAttribute("role", "button");
      row.setAttribute("aria-selected", p.id === seleccionado); row.dataset.id = p.id;
      row.innerHTML = `<canvas></canvas><div style="min-width:0"><div class="n">${esc(p.nombre)}</div><div class="r">${esc(p.rol)}</div></div><span class="estado ${est}" title="${ESTADO_TXT[est]}"></span>`;
      retrato(row.querySelector("canvas"), p.look);
      row.addEventListener("click", () => elegir(p.id));
      row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); elegir(p.id); } });
      sec.appendChild(row);
    }
    cont.appendChild(sec);
  }
}

function pintarFicha() {
  const p = POR_ID[seleccionado], jefe = DEPARTAMENTOS[p.dep].jefe, dJefe = estado?.trabajadores?.[jefe], est = estadoDe(p.id);
  const propio = p.jefe ? dJefe : null;
  const f = $("ficha");
  const cifras = propio?.cifras ? Object.entries(propio.cifras).map(([k, v]) => `<div class="cifra"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("") : "";
  const tipoSkill = (s) => /\.py|\.md|\/|yaml|Actions|three/.test(s) ? "code" : /^yt-|viral|prompt|hookscore|^\//.test(s) ? "ia" : "";
  const agentes = estado?.equipo?.agentes || {};
  const equipo = (p.equipo || []).map(id => `<span class="skill">${esc(POR_ID[id].nombre)} · ${esc(id)}</span>`).join("");
  const todas = p.jefe && estado?.equipo?.skills ? estado.equipo.skills.filter(s => !p.skills.includes(s)).map(s => `<span class="skill ia">${esc(s)}</span>`).join("") : "";
  f.innerHTML = `
    <div class="cab"><canvas></canvas><div style="min-width:0">
      <h2>${esc(p.nombre)}${p.jefe ? " ★" : ""}</h2>
      <div class="rol">${esc(p.rol)} · ${esc(DEPARTAMENTOS[p.dep].nombre)}</div>
      <span class="pill ${est}">${ESTADO_TXT[est]}${dJefe?.desde ? " · " + hace(dJefe.desde) : ""}</span>
    </div></div>
    <div class="bloque"><h4>${p.jefe ? "Ahora mismo" : "Su departamento"}</h4>
      <div class="tarea">${esc(dJefe?.tarea || "Sin datos todavía: la oficina se llena con la próxima foto del estado.")}</div>
      ${(dJefe?.detalle || []).length ? `<ul class="detalle">${dJefe.detalle.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    </div>
    ${cifras ? `<div class="bloque"><h4>Cifras</h4><div class="cifras">${cifras}</div></div>` : ""}
    <div class="bloque"><h4>Skills y herramientas</h4><div class="skills">${p.skills.map(s => `<span class="skill ${tipoSkill(s)}">${esc(s)}</span>`).join("")}</div>
      ${agentes[p.id] ? `<p class="equipo-de" style="margin:8px 0 0">${esc(agentes[p.id])}</p>` : ""}</div>
    ${equipo ? `<div class="bloque"><h4>Su equipo</h4><div class="skills">${equipo}</div></div>` : ""}
    ${todas ? `<div class="bloque"><h4>Además puede usar todas las skills del estudio</h4><div class="skills">${todas}</div></div>` : ""}
    ${p.id === "irene" && estado?.pendientes?.length ? `<div class="bloque"><h4>Pendientes del dueño</h4><ol class="pendientes">${estado.pendientes.slice(0, 6).map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : ""}
  `;
  retrato(f.querySelector("canvas"), p.look);
}

function pintarPie() {
  const t = estado?.trabajadores || {}, b = estado?.banco || {};
  const filas = (estado?.feed || []).slice(0, 4).map(e => `<div class="linea"><i>${esc(new Date(e.t).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }))}</i><b>${esc(POR_ID[e.quien]?.nombre || e.quien)}</b><span>${esc(e.texto)}</span></div>`).join("");
  $("teletipo").innerHTML = filas || `<div class="linea">Sin actividad registrada todavía.</div>`;
  const cont = [
    [t.valentin?.cifras?.novedades, "novedades del radar"], [t.pedro?.cifras?.guiones, "guiones"], [t.fernanda?.cifras?.["vídeos"], "vídeos"],
    [b.imagenes, "imágenes en el banco"], [b.animadas, "clips 3D"], [t.irene?.cifras?.aptos, "vídeos APTO"],
  ];
  $("contadores").innerHTML = cont.map(([v, k]) => `<div class="contador"><b>${v ?? "—"}</b><span>${k}</span></div>`).join("");
  const activos = Object.values(t).filter(w => w.estado === "trabajando").length;
  $("txt-activos").textContent = estado ? `${activos}/5 trabajando` : "Equipo —";
  $("chip-activos").className = "chip" + (activos ? " vivo" : "");
}

function pintarTodo() { pintarEquipo(); pintarFicha(); pintarPie(); }
function elegir(id) { seleccionado = id; pintarEquipo(); pintarFicha(); if (reducir) requestAnimationFrame(frame); }

function reloj() { $("reloj").textContent = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }); if (estado) $("txt-datos").textContent = "Foto del estado · " + hace(estado.actualizado); }
setInterval(reloj, 30000);

/* =====================================================================================================
   DATOS: la foto del estado vive en la base de datos de la página (doc oficina/estado). Claude la sube con
   clipfactory/oficina.py cada vez que trabaja; la oficina no necesita estar encendida para tenerla al día.
   ===================================================================================================== */
async function conectar() {
  const aviso = $("aviso");
  const db = await window.claude?.use?.("db").catch(() => null);
  if (!db) { aviso.hidden = false; aviso.textContent = "Esta vista no puede leer el estado. La oficina se ve, pero sin datos en directo."; $("txt-datos").textContent = "Sin conexión"; return; }
  const espera = setTimeout(() => { aviso.hidden = false; aviso.textContent = "El estado tarda en llegar; lo que ves puede no estar al día."; }, 10000);
  db.doc("oficina/estado").onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { clearTimeout(espera); aviso.hidden = true; }
    if (!snap.exists) { aviso.hidden = false; aviso.textContent = "Todavía no hay ninguna foto del estado. Pídele a Claude «actualiza la oficina»."; $("txt-datos").textContent = "Sin datos"; return; }
    estado = snap.data();
    const viejo = Date.now() - new Date(estado.actualizado).getTime() > 6 * 3600e3;
    $("chip-datos").className = "chip " + (viejo ? "viejo" : "vivo");
    reloj(); pintarTodo();
  }, () => { clearTimeout(espera); aviso.hidden = false; aviso.textContent = "No se pudo leer el estado en esta visita."; });
}

/* ---------- arranque ---------- */
montarObjetos(); pintarTodo(); reloj();
(document.fonts?.load ? Promise.all([document.fonts.load("6px Silkscreen"), document.fonts.load("bold 10px Silkscreen")]).catch(() => {}) : Promise.resolve())
  .finally(() => requestAnimationFrame(frame));
conectar();
</script>
