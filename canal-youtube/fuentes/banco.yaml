    - https://www.youtube.com/watch?v=VQRLujxTm3c   # Tráiler 2 (may-2025)
    - "ytsearch25:Grand Theft Auto VI Rockstar Games official"   # resto de vídeos oficiales (solo canal Rockstar Games)
    - "ytsearch15:GTA VI trailer Rockstar Games"
