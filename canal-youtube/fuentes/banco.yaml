# TOMMY · Banco de imágenes. El workflow "Tommy · Banco de imágenes" lo descarga TODO, lo etiqueta y lo deja
# animado en 3D en media/banco/ (galería: media/banco/GALERIA.md). Solo fuentes que se pueden usar:
#   - OFICIAL de Rockstar (galerías de capturas y artes de GTA VI; crédito "Imagen oficial: Rockstar Games")
#   - LIBRES de Wikimedia Commons (CC0 / dominio público / CC BY / CC BY-SA, crédito automático)
# Nada de imágenes de otros creadores o webs de fans (riesgo de reclamación y de "contenido reutilizado").

