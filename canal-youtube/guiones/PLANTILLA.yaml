# PLANTILLA de Short "¿Sabías que…?". Copia como SXXX.yaml y haz push: se produce solo (entregas/SXXX/).
# Reglas: 8-14 escenas; 1 frase de voz por escena (6-16 palabras); total 110-125 palabras (~45 s).
# Escena 1 = gancho (python3 -m clipfactory.hookscore_es "frase" >= 55). Última = cierre que enlaza con el gancho.
# Números y siglas escritos como se dicen ("GTA seis", "doce horas"). Cada dato con fuente en `fuentes`.
id: SXXX
formato: sabias-que
titulos:            # 3 opciones, <= 60 caracteres, "GTA 6" al principio
  - "GTA 6: ..."
  - "GTA 6: ..."
  - "GTA 6: ..."
portada:            # 1-3 palabras que NO repitan el título + visual
  texto: "NADIE LO VIO"
  kind: personaje   # dato | imagen | personaje | clock
  recorte: media/recortes/lucia.png   # para personaje (si no existe, sale el nombre en grande)
  nombre: LUCÍA
descripcion: "Primera línea = el dato. Segunda = contexto."
fuentes:
  - "medio — titular (fecha)"
creditos: "Imágenes oficiales: Rockstar Games"   # si usas imágenes oficiales
comentario: "¿Lo sabías? 👇"
hashtags: ["#lucia"]
musica: true
escenas:
  - texto: "¿Sabías que ...?"
    tarjeta: {kind: dato, grande: "DATO", titulo: "¿SABÍAS QUE…?", ty: 520, color: orange}
  - texto: "Frase con el contexto."
    tarjeta: {kind: personaje, recorte: media/recortes/lucia.png, nombre: LUCÍA, titulo: "LUCÍA CAMINOS", ty: 380, sub: "protagonista", credito: "Imagen oficial: Rockstar Games", color: magenta}
  - texto: "Otra frase."
    tarjeta: {kind: imagen, imagen: media/oficial/vice-city.jpg, titulo: "VICE CITY", ty: 520, sub: "dato corto", credito: "Imagen oficial: Rockstar Games"}
  - texto: "Truco de dinero."
    tarjeta: {kind: dinero, grande: "100.000 $", titulo: "TRUCO DE DINERO", ty: 380, sub: "en 10 minutos"}
  - texto: "Lista de cosas."
    tarjeta: {kind: lista, items: ["uno", "dos", "tres"], titulo: "3 DETALLES", ty: 450}
  - texto: "Cierre que vuelve al gancho."
    tarjeta: {kind: dato, grande: "?", titulo: "¿LO SABÍAS?", ty: 520, color: magenta}
# DIORAMA (estilo principal, como el vídeo de referencia): {kind: 3d, tipo: diorama, preset: consola|discos|almacen|red|isla|mapa_pin,
#   cielo: dia|noche, n: 45, progreso: 0.58, etiquetas: [{titulo: "SALE", texto: "De los servidores", icono: "⚡"}, …]}  (máx. 4 etiquetas)
# ESCENAS 3D (recomendado, mínimo 4 por vídeo, alternando con planas):
#   {kind: 3d, tipo: numero|texto|orbe|moneda|estrellas|billetes|mapa|versus|piedra|bombilla|corazon|foto, texto: "99", titulo: "…", sub: "…", color: gold|orange|cyan|magenta|white|green|red, n: 4}
#   versus: texto "GTA V|GTA VI". El texto 3D va sin acentos (los acentos van en titulo/sub).
#   piedra: lápida romana tallada cuyas letras se encienden (latín, historia). bombilla: se enciende (luz, idea).
#   corazon: late con cruces de curación (sanar, vida). foto: {imagen: media/oficial/x.jpg, alt: {tipo: versus, texto: "A|B"}}
#   foto del BANCO por etiqueta (ver media/banco/GALERIA.md): {kind: 3d, tipo: foto, banco: lucia|jason|policia|coche|florida|atracos…, estilo: lleno|inclinada|giro}
#   REGLA: la animación CUENTA la frase (no la repite en texto). Poco texto: titulo solo si aporta; los subtítulos ya dicen la frase.
# Tipos de tarjeta: clock (reloj grande), dato (texto grande), lista, imagen (foto a pantalla completa),
# personaje (recorte con brillo), dinero (bolsa + cifra), busqueda (n estrellas), split, three, timeline, bar.
# Banderas: bandera: nz|es|mx|ar. Objetos en cualquier tarjeta:
#   props: [{tipo: dinero|billetes|estrellas|sirena|pin|movil|coche|trofeo, x: 0-1, y: 0-1, tam: px, n: estrellas}]

# FORMATO GUÍA (fase 2, ver docs/fases.md): formato: guia
#   1 gancho con el premio  → {kind: 3d, tipo: foto, banco: deportivo, estilo: lleno} "Este coche está escondido y casi nadie lo ha visto."
#   2 dónde                 → {kind: 3d, tipo: mapa, texto: "VICE CITY"}            "Está en el puerto de Vice City, al sur."
#   3-5 pasos               → {kind: lista, items: ["1 · …", "2 · …", "3 · …"]}       un paso por frase, con nombres de calles/lugares
#   6 el truco o el peligro → {kind: 3d, tipo: estrellas, n: 3} + pausa: true         "Pero ojo…" (pausa dramática automática)
#   7 el premio             → {kind: 3d, tipo: numero, texto: "320 KM/H"}
#   8 cierre                → "Guárdalo para cuando juegues." (los guardados empujan el vídeo)
