# PLANTILLA de Short "¿Sabías que…?". Copia como SXXX.yaml y haz push: se produce solo (entregas/SXXX/).
# Reglas: 8-14 escenas; 1 frase de voz por escena (6-16 palabras); total 110-125 palabras (~45 s).
# Escena 1 = gancho (python3 -m clipfactory.hookscore_es "frase" >= 55). Última = cierre que enlaza con el gancho.
# Números y siglas escritos como se dicen ("GTA seis", "doce horas"). Cada dato con fuente en `fuentes`.
id: SXXX
formato: sabias-que
titulos:            # 3 opciones, <= 60 caracteres, "GTA 6" al principio
  - "GTA 6: ..."
  - "GTA 6: ..."
  - "GTA 6: ..."
portada:            # 1-3 palabras que NO repitan el título + visual
  texto: "NADIE LO VIO"
  kind: personaje   # dato | imagen | personaje | clock
  recorte: media/recortes/lucia.png   # para personaje (si no existe, sale el nombre en grande)
  nombre: LUCÍA
descripcion: "Primera línea = el dato. Segunda = contexto."
fuentes:
  - "medio — titular (fecha)"
creditos: "Imágenes oficiales: Rockstar Games"   # si usas imágenes oficiales
comentario: "¿Lo sabías? 👇"
hashtags: ["#lucia"]
musica: true
escenas:
  - texto: "¿Sabías que ...?"
    tarjeta: {kind: dato, grande: "DATO", titulo: "¿SABÍAS QUE…?", ty: 520, color: orange}
  - texto: "Frase con el contexto."
    tarjeta: {kind: personaje, recorte: media/recortes/lucia.png, nombre: LUCÍA, titulo: "LUCÍA CAMINOS", ty: 380, sub: "protagonista", credito: "Imagen oficial: Rockstar Games", color: magenta}
  - texto: "Otra frase."
    tarjeta: {kind: imagen, imagen: media/oficial/vice-city.jpg, titulo: "VICE CITY", ty: 520, sub: "dato corto", credito: "Imagen oficial: Rockstar Games"}
  - texto: "Lista de cosas."
    tarjeta: {kind: lista, items: ["uno", "dos", "tres"], titulo: "3 DETALLES", ty: 450}
  - texto: "Cierre que vuelve al gancho."
    tarjeta: {kind: dato, grande: "?", titulo: "¿LO SABÍAS?", ty: 520, color: magenta}
# Tipos de tarjeta: clock (reloj grande), dato (texto grande), lista, imagen (foto a pantalla completa),
# personaje (recorte con brillo), split, three, timeline, bar. Banderas: bandera: nz|es|mx|ar
