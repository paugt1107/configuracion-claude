escenas:
  - texto: "¿Sabías que tu GTA seis va a treinta FPS? Antes de quejarte, mira esto."
    tarjeta: {kind: dato, grande: "30 FPS", titulo: "¿SABÍAS QUE…?", ty: 520, color: orange}
  - texto: "Según Rob Nelson, de Rockstar, en consolas va a treinta imágenes por segundo."
    tarjeta: {kind: dato, grande: "30", titulo: "PS5 Y XBOX SERIES", ty: 520, sub: "según Rob Nelson (Rockstar)", color: cyan}
