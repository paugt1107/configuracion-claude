  - texto: "Ni en PS cinco Pro: su procesador rinde solo un siete por ciento más."
    tarjeta: {kind: dato, grande: "+7 %", titulo: "CPU DE PS5 PRO", ty: 520, sub: "según Digital Foundry", color: cyan}
  - texto: "Digital Foundry ve más realista un modo a cuarenta, aún sin confirmar."
    tarjeta: {kind: three, relojes: [["30", "CONFIRMADO"], ["40", "POSIBLE"], ["60", "SIN CONFIRMAR"]], titulo: "¿Y LOS 40 FPS?", ty: 330, tsize: 70}
  - texto: "¿Prefieres treinta con más detalle o sesenta con menos? Comenta."
    tarjeta: {kind: split, reloj: "30", sub: "MÁS DETALLE", reloj2: "60", sub2: "MÁS FLUIDO", color: magenta, titulo: "¿CUÁL ELIGES?", ty: 330}
  - texto: "Ahora ya sabes por qué tu GTA seis va a treinta."
    tarjeta: {kind: dato, grande: "30 FPS", titulo: "AHORA YA LO SABES", ty: 520, color: orange}
