id: S007
formato: sabias-que
juego: ninguno
estilo: foto
titulos:
  - "¿Huevo o gallina? La ciencia ya tiene respuesta"
  - "Qué fue antes, el huevo o la gallina (de verdad)"
  - "El huevo existía 300 millones de años antes que la gallina"
portada:
  texto: "¿HUEVO O GALLINA?"
  kind: dato
  grande: "?"
descripcion: "Los huevos existen desde hace más de 300 millones de años; los restos de gallina doméstica más antiguos conocidos tienen unos 3.500 años. Y el primer huevo de gallina lo puso un ave casi gallina (razonamiento evolutivo habitual, no un estudio concreto)."
fuentes:
  - "Peters et al., PNAS 2022 — restos de gallina doméstica en Ban Non Wat (Tailandia), c. 1650-1250 a. C."
  - "Wang et al., Cell Research 2020 — la gallina doméstica procede del gallo bankiva (Gallus gallus spadiceus)"
  - "Smithsonian, 2019 — primeros amniotas (huevo amniótico) hace c. 315 millones de años (Joggins, Nova Scotia)"
  - "Stein et al., Scientific Reports 2019 / Natural History Museum 2020 — huevos de dinosaurio más antiguos, c. 195-190 millones de años"
  - "Universidad de Warwick, 2010 — proteína ovocleidina-17 y la cáscara (titular mediático, matizado por los propios autores)"
comentario: "¿Huevo o gallina? Tú votas 👇"
hashtags: ["#curiosidades", "#ciencia"]
musica: true
escenas:
  - texto: "¿Sabías que el huevo existía trescientos millones de años antes que la gallina? Te lo demuestro."
    tarjeta: {"cielo": "dia", "etiquetas": [{"icono": "🥚", "texto": "¿Quién primero?", "titulo": "La gran duda"}], "kind": "3d", "preset": "gallina", "tipo": "diorama"}
  - texto: "Los primeros animales con huevo propio aparecieron hace más de trescientos millones de años."
    tarjeta: {"cielo": "dia", "etiquetas": [{"icono": "🥚", "texto": "+300 M años", "titulo": "Primeros huevos"}], "kind": "3d", "n": 36, "preset": "huevos", "tipo": "diorama"}
  - texto: "Los dinosaurios ya los ponían hace unos ciento noventa y cinco millones."
    tarjeta: {"kind": "3d", "tipo": "foto", "estilo": "inclinada", "libre": ["dinosaur eggs nest fossil", "Hypselosaurus eggs"], "foco": {"x": 0.5, "y": 0.5}, "zoom": 1.7, "notas": [{"texto": "Huevos de dinosaurio · 195 M años", "x": 0.5, "y": 0.5, "t": 0.6}], "alt": {"cielo": "dia", "etiquetas": [{"icono": "🦖", "texto": "Ya ponían huevos", "titulo": "Dinosaurios"}, {"icono": "⏳", "texto": "195 M años", "titulo": "Hace"}], "preset": "dino", "tipo": "diorama"}}
  - texto: "¿Y la gallina doméstica? Sus restos más antiguos tienen unos tres mil quinientos años."
    tarjeta: {"cielo": "noche", "etiquetas": [{"icono": "🐔", "texto": "3.500 años", "titulo": "Gallina doméstica"}], "kind": "3d", "preset": "gallina", "tipo": "diorama"}
  - texto: "Viene del gallo bankiva, un ave salvaje del sudeste asiático."
    tarjeta: {"alt": {"color": "orange", "texto": "GALLO BANKIVA", "tipo": "texto"}, "estilo": "giro", "kind": "3d", "libre": ["red junglefowl rooster", "Gallus gallus"], "tipo": "foto", "foco": {"x": 0.62, "y": 0.4}, "zoom": 1.7, "notas": [{"texto": "Gallo bankiva", "x": 0.62, "y": 0.4, "t": 0.5}]}
  - texto: "Pero ojo, que aquí viene el truco…"
    pausa: true
    tarjeta: {"cielo": "noche", "etiquetas": [{"icono": "❓", "texto": "Aquí viene el truco", "titulo": "Ojo"}], "kind": "3d", "n": 10, "preset": "huevos", "tipo": "diorama"}
  - texto: "El primer huevo de gallina lo puso un ave casi gallina."
    tarjeta: {"cielo": "noche", "etiquetas": [{"icono": "🥚", "texto": "Pone el huevo", "titulo": "Ave casi gallina"}], "kind": "3d", "preset": "gallina", "tipo": "diorama"}
  - texto: "Dentro, por pequeñas mutaciones, nació la primera gallina de la historia."
    tarjeta: {"cielo": "dia", "etiquetas": [{"icono": "🧬", "texto": "Pequeñas", "titulo": "Mutación"}, {"icono": "🐣", "texto": "La 1.ª gallina", "titulo": "Nace"}], "kind": "3d", "preset": "nacer", "tipo": "diorama"}
  - texto: "Así que el huevo fue primero."
    tarjeta: {"cielo": "dia", "etiquetas": [{"icono": "🏆", "texto": "El huevo", "titulo": "Ganador"}], "kind": "3d", "preset": "podio", "tipo": "diorama"}
  - texto: "En dos mil diez, Sheffield y Warwick hallaron una proteína de gallina clave para la cáscara."
    tarjeta: {"alt": {"texto": "PROTEÍNA", "tipo": "bombilla"}, "kind": "3d", "texto": "PROTEÍNA", "tipo": "bombilla"}
  - texto: "Dijeron que fue antes la gallina, pero otros científicos lo matizaron."
    tarjeta: {"cielo": "noche", "etiquetas": [{"icono": "🐔", "texto": "Primero la gallina", "titulo": "Warwick, 2010"}, {"icono": "⚖", "texto": "Lo matizan", "titulo": "Otros"}], "kind": "3d", "preset": "gallina", "tipo": "diorama"}
  - texto: "¿Tú qué dices, huevo o gallina? Te leo en comentarios."
    tarjeta: {"cielo": "dia", "etiquetas": [{"icono": "🗳", "texto": "¿Huevo o gallina?", "titulo": "Tú decides"}], "kind": "3d", "n": 20, "preset": "huevos", "tipo": "diorama"}
