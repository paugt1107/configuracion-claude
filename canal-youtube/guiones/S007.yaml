    kind: 3d
    tipo: mundo
    zona: primeros
    etiquetas:
    - titulo: Primeros huevos
      texto: +300 M años
      icono: 🦎
      ancla: primeros_huevos
- texto: Los dinosaurios ya los ponían hace unos ciento noventa y cinco millones.
  tarjeta:
    kind: 3d
    tipo: mundo
    zona: dinos
    etiquetas:
    - titulo: Dinosaurios
      texto: 195 M años
      icono: 🦖
      ancla: dinos_nido
    foto:
