id: S007
formato: sabias-que
juego: ninguno
estilo: foto
titulos:
  - "¿Huevo o gallina? La ciencia ya tiene respuesta"
  - "Qué fue antes, el huevo o la gallina (de verdad)"
  - "El huevo existía 300 millones de años antes que la gallina"
portada:
  texto: "¿HUEVO O GALLINA?"
  kind: dato
  grande: "?"
descripcion: "Los huevos existen desde hace más de 300 millones de años; los restos de gallina doméstica más antiguos conocidos tienen unos 3.500 años. Y el primer huevo de gallina lo puso un ave casi gallina (razonamiento evolutivo habitual, no un estudio concreto)."
fuentes:
  - "Peters et al., PNAS 2022 — restos de gallina doméstica en Ban Non Wat (Tailandia), c. 1650-1250 a. C."
  - "Wang et al., Cell Research 2020 — la gallina doméstica procede del gallo bankiva (Gallus gallus spadiceus)"
  - "Smithsonian, 2019 — primeros amniotas (huevo amniótico) hace c. 315 millones de años (Joggins, Nova Scotia)"
  - "Stein et al., Scientific Reports 2019 / Natural History Museum 2020 — huevos de dinosaurio más antiguos, c. 195-190 millones de años"
  - "Universidad de Warwick, 2010 — proteína ovocleidina-17 y la cáscara (titular mediático, matizado por los propios autores)"
comentario: "¿Huevo o gallina? Tú votas 👇"
hashtags: ["#curiosidades", "#ciencia"]
musica: true
escenas:
  - texto: "¿Sabías que el huevo existía trescientos millones de años antes que la gallina? Te lo demuestro."
    tarjeta: {"kind": "3d", "tipo": "diorama", "preset": "gallina", "cielo": "dia", "etiquetas": [{"titulo": "La gran duda", "texto": "¿Quién primero?", "icono": "🥚"}]}
  - texto: "Los primeros animales con huevo propio aparecieron hace más de trescientos millones de años."
    tarjeta: {"kind": "3d", "tipo": "diorama", "preset": "huevos", "cielo": "dia", "etiquetas": [{"titulo": "Primeros huevos", "texto": "+300 M años", "icono": "🥚"}], "n": 36}
  - texto: "Los dinosaurios ya los ponían hace unos ciento noventa y cinco millones."
    tarjeta: {"kind": "3d", "tipo": "foto", "libre": ["dinosaur eggs nest fossil", "Hypselosaurus eggs"], "foco": {"x": 0.5, "y": 0.5}, "zoom": 1.6, "notas": [{"texto": "Huevos de dinosaurio · 195 M años", "x": 0.5, "y": 0.5, "t": 0.5}], "alt": {"kind": "3d", "tipo": "diorama", "preset": "dino", "cielo": "dia", "etiquetas": [{"titulo": "Hace", "texto": "195 M años", "icono": "⏳"}]}}
  - texto: "Y ni rastro de ninguna gallina."
    tarjeta: {"kind": "3d", "tipo": "diorama", "preset": "dino", "cielo": "noche", "etiquetas": [{"titulo": "Gallinas", "texto": "Ni una", "icono": "🚫"}]}
  - texto: "La gallina doméstica tiene unos tres mil quinientos años."
    tarjeta: {"kind": "3d", "tipo": "diorama", "preset": "trio", "cielo": "dia", "etiquetas": [{"titulo": "Gallina doméstica", "texto": "3.500 años", "icono": "🐔"}]}
  - texto: "Viene del gallo bankiva, un ave salvaje del sudeste asiático."
    tarjeta: {"kind": "3d", "tipo": "foto", "libre": ["red junglefowl rooster", "Gallus gallus"], "foco": {"x": 0.62, "y": 0.4}, "zoom": 1.7, "notas": [{"texto": "Gallo bankiva", "x": 0.62, "y": 0.4, "t": 0.5}], "alt": {"kind": "3d", "tipo": "diorama", "preset": "gallina", "cielo": "dia", "etiquetas": [{"titulo": "Origen", "texto": "Gallo bankiva", "icono": "🐓"}]}}
  - texto: "Pero ojo, que aquí viene el truco…"
    pausa: true
    tarjeta: {"kind": "3d", "tipo": "diorama", "preset": "pila", "cielo": "noche", "etiquetas": [{"titulo": "Ojo", "texto": "Aquí viene el truco", "icono": "❓"}]}
  - texto: "El primer huevo de gallina lo puso un ave casi gallina."
    tarjeta: {"kind": "3d", "tipo": "diorama", "preset": "gallina", "cielo": "noche", "etiquetas": [{"titulo": "Ave casi gallina", "texto": "Pone el huevo", "icono": "🥚"}]}
  - texto: "Dentro, por pequeñas mutaciones, nació la primera gallina de la historia."
    tarjeta: {"kind": "3d", "tipo": "diorama", "preset": "nacer", "cielo": "dia", "etiquetas": [{"titulo": "Mutación", "texto": "Pequeñas", "icono": "🧬"}, {"titulo": "Nace", "texto": "La 1.ª gallina", "icono": "🐣"}]}
  - texto: "Así que el huevo fue primero."
    tarjeta: {"kind": "3d", "tipo": "diorama", "preset": "podio", "cielo": "dia", "etiquetas": [{"titulo": "Ganador", "texto": "El huevo", "icono": "🏆"}]}
  - texto: "En dos mil diez, Sheffield y Warwick hallaron una proteína de gallina clave para la cáscara."
    tarjeta: {"kind": "3d", "tipo": "bombilla", "texto": "PROTEÍNA"}
  - texto: "Dijeron que fue antes la gallina, pero otros científicos lo matizaron."
    tarjeta: {"kind": "3d", "tipo": "diorama", "preset": "trio", "cielo": "noche", "etiquetas": [{"titulo": "Warwick, 2010", "texto": "Primero la gallina", "icono": "🐔"}, {"titulo": "Otros", "texto": "Lo matizan", "icono": "⚖"}]}
  - texto: "¿Tú qué dices, huevo o gallina? Te leo en comentarios."
    tarjeta: {"kind": "3d", "tipo": "diorama", "preset": "cesta", "cielo": "dia", "etiquetas": [{"titulo": "Tú decides", "texto": "¿Huevo o gallina?", "icono": "🗳"}]}
